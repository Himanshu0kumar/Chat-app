name: Enterprise CI/CD Pipeline

# =========================================================================
# TRIGGERS: When should this pipeline execute?
# =========================================================================
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

# =========================================================================
# ENVIRONMENT VARIABLES & GLOBAL SETTINGS
# =========================================================================
env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# =========================================================================
# CONCURRENCY CONTROL: Cancel redundant runs on pull requests
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =========================================================================
# PIPELINE JOBS
# =========================================================================
jobs:
  # -----------------------------------------------------------------------
  # JOB 1: CODE QUALITY & TESTING (Continuous Integration)
  # -----------------------------------------------------------------------
  lint-and-test:
    name: 🧪 1. Lint, Syntax Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime (with NPM Cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🔍 Code Lint & Syntax Check
        run: npm run lint

      - name: 🧪 Run Automated Tests
        run: npm test

  # -----------------------------------------------------------------------
  # JOB 2: BUILD PRODUCTION ASSETS
  # -----------------------------------------------------------------------
  build-app:
    name: 🏗️ 2. Build Frontend & Backend Bundles
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: ⚡ Build Production Bundle (Vite)
        run: npm run build

      - name: 📤 Archive Build Artifacts (dist)
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # -----------------------------------------------------------------------
  # JOB 3: DOCKER CONTAINERIZATION & SECURITY SCAN
  # -----------------------------------------------------------------------
  docker-build:
    name: 🐳 3. Docker Multi-Stage Container Build
    needs: build-app
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker Production Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true when authenticating with Docker Hub or GHCR
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # JOB 4: DEPLOYMENT (Continuous Deployment)
  # -----------------------------------------------------------------------
  deploy:
    name: 🚀 4. Deploy to Staging / Production
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist/

      - name: 🚀 Continuous Deployment Execution
        run: |
          echo "======================================================="
          echo "🎉 CI/CD Pipeline Completed Successfully!"
          echo "🚀 Deploying CipherChat E2EE Web Desktop to Production..."
          echo "Target Environment: Production Node Server & Docker Cluster"
          echo "Timestamp: $(date)"
          echo "======================================================="
